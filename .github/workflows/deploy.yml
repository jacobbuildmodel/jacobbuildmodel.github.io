name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Daily rebuild so future-dated posts go live on their date without a manual
  # push. hugo.toml has buildFuture = false and no timeZone, so a post dated
  # YYYY-MM-DD becomes eligible at 00:00 UTC (08:00 Singapore); the run at
  # 00:30 UTC (08:30 Singapore) is meant to publish it, with a second run at
  # 01:30 UTC as a backup. GitHub starts scheduled runs late under load, and
  # can drop them: from 25 Sep to 2 Oct 2026 the 00:30 run started between
  # 05:13 and 06:22 UTC. A rebuild is idempotent, so two runs on one day are
  # harmless. workflow_dispatch above stays for publishing by hand.
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 1 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Runs BEFORE build, in the same workflow, because `needs:` only works between
  # jobs in one file. A separate lint.yml workflow cannot gate this one; it would
  # go red while the site deployed anyway.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check prose and encoding
        # Files are named explicitly, never content/*.md: about.md and
        # disclaimer.md are written in a different voice and are not meant to
        # pass the article linter. A named single file that does not exist yet
        # is skipped with a notice rather than passed to aitell.py, which would
        # crash on it and block every deploy (a named page may land in a later
        # PR). Globs use nullglob, so an empty content/open/ lints nothing.
        run: |
          shopt -s nullglob
          files=(content/economics/*.md content/process/*.md content/open/*.md)
          for f in content/scorecard.md content/corrections.md content/ideas.md; do
            if [ -f "$f" ]; then
              files+=("$f")
            else
              echo "skipped, not present: $f"
            fi
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "no files to lint"; exit 0
          fi
          python scripts/aitell.py "${files[@]}" --strict --published-only

  build:
    needs: lint
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.9
    steps:
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Fetch theme (pinned in go.mod and go.sum, never the latest)
        # A bare "hugo mod get <module>" here moved to PaperMod's newest
        # release on every run; its 18 Oct 2026 release needs Hugo 0.158+, so
        # every build failed from 19 Oct. The version now lives in go.mod and
        # go.sum. Upgrading the theme means upgrading Hugo too, in its own PR.
        run: |
          hugo mod verify
          hugo mod graph | grep -F "hugo-PaperMod@v0.0.0-20260802175912-d3768854d00a"

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Theme still pinned after the build
        run: git diff --exit-code -- go.mod go.sum

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
