name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Daily rebuild so future-dated posts go live on their date without a manual
  # push. hugo.toml has buildFuture = false and no timeZone, so a post dated
  # YYYY-MM-DD becomes eligible at 00:00 UTC (08:00 Singapore); this run at
  # 00:30 UTC (08:30 Singapore) publishes it.
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Runs BEFORE build, in the same workflow, because `needs:` only works between
  # jobs in one file. A separate lint.yml workflow cannot gate this one; it would
  # go red while the site deployed anyway.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check prose and encoding
        # Files are named explicitly, never content/*.md: about.md and
        # disclaimer.md are written in a different voice and are not meant to
        # pass the article linter. A named single file that does not exist yet
        # is skipped with a notice rather than passed to aitell.py, which would
        # crash on it and block every deploy (corrections.md arrives in its own
        # PR). Globs use nullglob, so an empty content/open/ lints nothing.
        run: |
          shopt -s nullglob
          files=(content/economics/*.md content/process/*.md content/open/*.md)
          for f in content/scorecard.md content/corrections.md; do
            if [ -f "$f" ]; then
              files+=("$f")
            else
              echo "skipped, not present: $f"
            fi
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "no files to lint"; exit 0
          fi
          python scripts/aitell.py "${files[@]}" --strict --published-only

  build:
    needs: lint
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.9
    steps:
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Fetch theme
        run: hugo mod get github.com/adityatelange/hugo-PaperMod

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
