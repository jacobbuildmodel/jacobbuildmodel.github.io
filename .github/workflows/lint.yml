# .github/workflows/lint.yml
#
# Two changes from the version Gemini suggested, both of which matter:
#
#   1. aitell.py needs --strict to exit non-zero. Without it the script prints
#      its findings and returns 0, so the job goes green no matter what it found
#      and nothing is ever blocked.
#   2. --published-only skips files still carrying `draft: true`. Without it
#      every work-in-progress breaks CI and you will disable the check within a
#      week.
#
# A green check does not block a deploy on its own. Either make this a required
# status check in branch protection, or give the deploy job `needs: lint` as
# shown in deploy.yml.

name: lint

# Pull requests only. On push to main the lint runs inside deploy.yml, where it
# actually gates the build; running it here too would just duplicate the job.
on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check prose and encoding
        run: |
          shopt -s nullglob
          files=(content/economics/*.md content/process/*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no files to lint"; exit 0
          fi
          python scripts/aitell.py "${files[@]}" --strict --published-only

  # Vale (github.com/errata-ai/vale), rules in styles/Site/ (see .vale.ini),
  # over the content/**/*.md files this pull request adds or changes. Only
  # those: the older articles still carry hits, listed in the PR that added
  # this job for a separate cleanup, and checking them here would keep every
  # PR red. An error fails the job; a warning (the causal verbs) is printed
  # for the checker and does not. Pull requests only, like the job above;
  # deploy.yml's gate is unchanged.
  vale:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: "3.24.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Vale
        run: |
          wget -q -O "${{ runner.temp }}/vale.tar.gz" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          tar -xzf "${{ runner.temp }}/vale.tar.gz" -C "${{ runner.temp }}" vale
          echo "${{ runner.temp }}" >> "$GITHUB_PATH"
      - name: Check changed content with Vale
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'content/*.md')
          if [ ${#files[@]} -eq 0 ]; then
            echo "no changed content files"; exit 0
          fi
          printf 'checking %s\n' "${files[@]}"
          vale --no-wrap "${files[@]}"
