<text x="16.0" y="714.0" font-size="14" fill="var(--fig-ink-3,#717171)">Each panel is one covered job: how far its pay at the</text>
<text x="16.0" y="733.0" font-size="14" fill="var(--fig-ink-3,#717171)">one-in-four mark (the 25th percentile of gross pay: a</text>
<text x="16.0" y="752.0" font-size="14" fill="var(--fig-ink-3,#717171)">quarter of workers earned this or less) sat above or</text>
<text x="16.0" y="771.0" font-size="14" fill="var(--fig-ink-3,#717171)">below the same mark in jobs with no ladder, in per</text>
<text x="16.0" y="790.0" font-size="14" fill="var(--fig-ink-3,#717171)">cent, one dot per June. Dark bands: the years</text>
<text x="16.0" y="809.0" font-size="14" fill="var(--fig-ink-3,#717171)">compared, before and after the ladder. Pale band: the</text>
<text x="16.0" y="828.0" font-size="14" fill="var(--fig-ink-3,#717171)">transition, left out. Dashed box: 2020-21, left out.</text>
<text x="16.0" y="847.0" font-size="14" fill="var(--fig-ink-3,#717171)">Dashed lines: the before and after averages; look for</text>
<text x="16.0" y="866.0" font-size="14" fill="var(--fig-ink-3,#717171)">the step between the dark bands. Grey panels failed</text>
<text x="16.0" y="885.0" font-size="14" fill="var(--fig-ink-3,#717171)">the design test: pay was already moving before the</text>
<text x="16.0" y="904.0" font-size="14" fill="var(--fig-ink-3,#717171)">ladder, so their step is not read.</text>
