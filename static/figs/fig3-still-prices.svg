<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Bar chart of the median excess January price move, in log points, among the 32 consumer price index series whose January movement is otherwise very small, for each year from 2010 to 2026. Every non-GST year lies between minus 0.19 and plus 0.16, averaging minus 0.01 with a standard deviation across years of 0.08. The two GST years stand far above the rest: January 2023 at plus 0.68 and January 2024 at plus 0.45, which are 8.2 and 5.5 standard deviations above the non-GST average and the two largest values in the seventeen years shown." style="max-width:100%;height:auto">
  <style>
    :root{--fig-ink:#0b0b0b;--fig-ink-2:#52514e;--fig-ink-3:#717171;--fig-rule:#e2e1dd;
      --fig-surface:#fcfcfa;--fig-subject:#2873ce;--fig-context:#707379;}
    @media (prefers-color-scheme: dark){
      :root{--fig-ink:#ffffff;--fig-ink-2:#c3c2b7;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;
        --fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}
    }
    :root[data-theme="dark"]{--fig-ink:#ffffff;--fig-ink-2:#c3c2b7;--fig-ink-3:#9a9a9a;
      --fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}
    text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
    .fg{fill:var(--fig-ink,#0b0b0b)} .mut{fill:var(--fig-ink-3,#717171)}
    .lbl{font-size:14px} .lbl-b{font-size:14px;font-weight:600}
    .grid{stroke:var(--fig-rule,#e2e1dd);stroke-width:1;fill:none}
    .axis{stroke:var(--fig-ink-3,#717171);stroke-width:1;fill:none}
    .ctx{fill:var(--fig-context,#707379)} .ctxs{stroke:var(--fig-context,#707379)}
    .acc{fill:var(--fig-subject,#2873ce)} .accs{stroke:var(--fig-subject,#2873ce)}
  </style>
  <line class="grid" stroke="#e2e1dd" x1="46" y1="212.3" x2="464" y2="212.3"/>
  <text class="lbl mut" fill="#717171" x="38" y="216.3" text-anchor="end" font-variant-numeric="tabular-nums">-0.2</text>
  <line class="grid" stroke="#e2e1dd" x1="46" y1="180.6" x2="464" y2="180.6"/>
  <text class="lbl mut" fill="#717171" x="38" y="184.6" text-anchor="end" font-variant-numeric="tabular-nums">+0.0</text>
  <line class="grid" stroke="#e2e1dd" x1="46" y1="149.0" x2="464" y2="149.0"/>
  <text class="lbl mut" fill="#717171" x="38" y="153.0" text-anchor="end" font-variant-numeric="tabular-nums">+0.2</text>
  <line class="grid" stroke="#e2e1dd" x1="46" y1="117.3" x2="464" y2="117.3"/>
  <text class="lbl mut" fill="#717171" x="38" y="121.3" text-anchor="end" font-variant-numeric="tabular-nums">+0.4</text>
  <line class="grid" stroke="#e2e1dd" x1="46" y1="85.7" x2="464" y2="85.7"/>
  <text class="lbl mut" fill="#717171" x="38" y="89.7" text-anchor="end" font-variant-numeric="tabular-nums">+0.6</text>
  <line class="grid" stroke="#e2e1dd" x1="46" y1="54.0" x2="464" y2="54.0"/>
  <text class="lbl mut" fill="#717171" x="38" y="58.0" text-anchor="end" font-variant-numeric="tabular-nums">+0.8</text>
  <line class="axis" stroke="#717171" x1="46" y1="180.6" x2="464" y2="180.6"/>
  <rect class="ctx" fill="#707379" x="50.7" y="180.6" width="15.2" height="30.2"/>
  <text class="lbl mut" fill="#717171" x="58.3" y="256" text-anchor="middle">10</text>
  <rect class="ctx" fill="#707379" x="75.3" y="174.2" width="15.2" height="6.4"/>
  <rect class="ctx" fill="#707379" x="99.8" y="180.6" width="15.2" height="1.9"/>
  <text class="lbl mut" fill="#717171" x="107.5" y="256" text-anchor="middle">12</text>
  <rect class="ctx" fill="#707379" x="124.4" y="180.6" width="15.2" height="2.8"/>
  <rect class="ctx" fill="#707379" x="149.0" y="155.6" width="15.2" height="25.0"/>
  <text class="lbl mut" fill="#717171" x="156.6" y="256" text-anchor="middle">14</text>
  <rect class="ctx" fill="#707379" x="173.6" y="179.9" width="15.2" height="0.7"/>
  <rect class="ctx" fill="#707379" x="198.2" y="180.6" width="15.2" height="3.7"/>
  <text class="lbl mut" fill="#717171" x="205.8" y="256" text-anchor="middle">16</text>
  <rect class="ctx" fill="#707379" x="222.8" y="180.6" width="15.2" height="17.6"/>
  <rect class="ctx" fill="#707379" x="247.4" y="180.6" width="15.2" height="6.4"/>
  <text class="lbl mut" fill="#717171" x="255.0" y="256" text-anchor="middle">18</text>
  <rect class="ctx" fill="#707379" x="272.0" y="159.4" width="15.2" height="21.2"/>
  <rect class="ctx" fill="#707379" x="296.6" y="180.6" width="15.2" height="4.2"/>
  <text class="lbl mut" fill="#717171" x="304.2" y="256" text-anchor="middle">20</text>
  <rect class="ctx" fill="#707379" x="321.1" y="180.6" width="15.2" height="0.0"/>
  <rect class="ctx" fill="#707379" x="345.7" y="180.6" width="15.2" height="0.0"/>
  <text class="lbl mut" fill="#717171" x="353.4" y="256" text-anchor="middle">22</text>
  <rect class="acc" fill="#2873ce" x="370.3" y="73.8" width="15.2" height="106.8"/>
  <text class="lbl-b acc" fill="#2873ce" x="377.9" y="65.8" text-anchor="middle">2023</text>
  <rect class="acc" fill="#2873ce" x="394.9" y="109.9" width="15.2" height="70.7"/>
  <text class="lbl-b acc" fill="#2873ce" x="402.5" y="101.9" text-anchor="middle">2024</text>
  <text class="lbl mut" fill="#717171" x="402.5" y="256" text-anchor="middle">24</text>
  <rect class="ctx" fill="#707379" x="419.5" y="180.6" width="15.2" height="5.4"/>
  <rect class="ctx" fill="#707379" x="444.1" y="180.6" width="15.2" height="1.4"/>
  <text class="lbl mut" fill="#717171" x="451.7" y="256" text-anchor="middle">26</text>
  <text class="lbl mut" fill="#717171" x="46" y="16">median excess January move in log points,</text>
  <text class="lbl mut" fill="#717171" x="46" y="34">the 32 prices that otherwise hold still</text>
  <text class="lbl mut" fill="#717171" x="46" y="288">Every other January averages -0.01.</text>
  <text class="lbl mut" fill="#717171" x="46" y="306">The two GST years are +0.68 and +0.45.</text>
</svg>
