<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Bar chart of the median excess January price move, in log points, among the 32 consumer price index series whose January movement is otherwise very small, for each year from 2010 to 2026. Every non-GST year lies between minus 0.19 and plus 0.16, averaging minus 0.01 with a standard deviation across years of 0.08. The two GST years stand far above the rest: January 2023 at plus 0.68 and January 2024 at plus 0.45, which are 8.2 and 5.5 standard deviations above the non-GST average and the two largest values in the seventeen years shown." style="max-width:100%;height:auto">
  <style>
    :root{--fg:#1c1c1c;--muted:#767676;--faint:#c8c8c8;--grid:#e6e6e6;--accent:#0b6bcb;}
    @media (prefers-color-scheme: dark){
      :root{--fg:#ececec;--muted:#9a9a9a;--faint:#565656;--grid:#3a3a3a;--accent:#5aa9f0;}
    }
    .fg{fill:var(--fg,#1c1c1c)} .mut{fill:var(--muted,#767676)}
    .lbl{font:11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .lbl-b{font:600 11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .grid{stroke:var(--grid,#e6e6e6);stroke-width:1;fill:none}
    .axis{stroke:var(--muted,#767676);stroke-width:1;fill:none}
    .ctx{fill:var(--faint,#c8c8c8)} .ctxs{stroke:var(--faint,#c8c8c8)}
    .acc{fill:var(--accent,#0b6bcb)} .accs{stroke:var(--accent,#0b6bcb)}
  </style>
  <line class="grid" stroke="#e6e6e6" x1="52" y1="206.2" x2="620" y2="206.2"/>
  <text class="lbl mut" fill="#767676" x="44" y="210.2" text-anchor="end">-0.2</text>
  <line class="grid" stroke="#e6e6e6" x1="52" y1="171.7" x2="620" y2="171.7"/>
  <text class="lbl mut" fill="#767676" x="44" y="175.7" text-anchor="end">+0.0</text>
  <line class="grid" stroke="#e6e6e6" x1="52" y1="137.3" x2="620" y2="137.3"/>
  <text class="lbl mut" fill="#767676" x="44" y="141.3" text-anchor="end">+0.2</text>
  <line class="grid" stroke="#e6e6e6" x1="52" y1="102.9" x2="620" y2="102.9"/>
  <text class="lbl mut" fill="#767676" x="44" y="106.9" text-anchor="end">+0.4</text>
  <line class="grid" stroke="#e6e6e6" x1="52" y1="68.4" x2="620" y2="68.4"/>
  <text class="lbl mut" fill="#767676" x="44" y="72.4" text-anchor="end">+0.6</text>
  <line class="grid" stroke="#e6e6e6" x1="52" y1="34.0" x2="620" y2="34.0"/>
  <text class="lbl mut" fill="#767676" x="44" y="38.0" text-anchor="end">+0.8</text>
  <line class="axis" stroke="#767676" x1="52" y1="171.7" x2="620" y2="171.7"/>
  <rect class="ctx" fill="#c8c8c8" x="58.3" y="171.7" width="20.7" height="32.9"/>
  <text class="lbl mut" fill="#767676" x="68.7" y="250" text-anchor="middle">10</text>
  <rect class="ctx" fill="#c8c8c8" x="91.8" y="164.8" width="20.7" height="6.9"/>
  <rect class="ctx" fill="#c8c8c8" x="125.2" y="171.7" width="20.7" height="2.1"/>
  <text class="lbl mut" fill="#767676" x="135.5" y="250" text-anchor="middle">12</text>
  <rect class="ctx" fill="#c8c8c8" x="158.6" y="171.7" width="20.7" height="3.1"/>
  <rect class="ctx" fill="#c8c8c8" x="192.0" y="144.5" width="20.7" height="27.2"/>
  <text class="lbl mut" fill="#767676" x="202.4" y="250" text-anchor="middle">14</text>
  <rect class="ctx" fill="#c8c8c8" x="225.4" y="171.0" width="20.7" height="0.8"/>
  <rect class="ctx" fill="#c8c8c8" x="258.8" y="171.7" width="20.7" height="4.0"/>
  <text class="lbl mut" fill="#767676" x="269.2" y="250" text-anchor="middle">16</text>
  <rect class="ctx" fill="#c8c8c8" x="292.2" y="171.7" width="20.7" height="19.1"/>
  <rect class="ctx" fill="#c8c8c8" x="325.6" y="171.7" width="20.7" height="7.0"/>
  <text class="lbl mut" fill="#767676" x="336.0" y="250" text-anchor="middle">18</text>
  <rect class="ctx" fill="#c8c8c8" x="359.1" y="148.7" width="20.7" height="23.1"/>
  <rect class="ctx" fill="#c8c8c8" x="392.5" y="171.7" width="20.7" height="4.6"/>
  <text class="lbl mut" fill="#767676" x="402.8" y="250" text-anchor="middle">20</text>
  <rect class="ctx" fill="#c8c8c8" x="425.9" y="171.7" width="20.7" height="0.0"/>
  <rect class="ctx" fill="#c8c8c8" x="459.3" y="171.7" width="20.7" height="0.0"/>
  <text class="lbl mut" fill="#767676" x="469.6" y="250" text-anchor="middle">22</text>
  <rect class="acc" fill="#0b6bcb" x="492.7" y="55.5" width="20.7" height="116.2"/>
  <text class="lbl-b acc" fill="#0b6bcb" x="503.1" y="49.5" text-anchor="middle">2023</text>
  <rect class="acc" fill="#0b6bcb" x="526.1" y="94.8" width="20.7" height="77.0"/>
  <text class="lbl-b acc" fill="#0b6bcb" x="536.5" y="88.8" text-anchor="middle">2024</text>
  <text class="lbl mut" fill="#767676" x="536.5" y="250" text-anchor="middle">24</text>
  <rect class="ctx" fill="#c8c8c8" x="559.5" y="171.7" width="20.7" height="5.9"/>
  <rect class="ctx" fill="#c8c8c8" x="592.9" y="171.7" width="20.7" height="1.5"/>
  <text class="lbl mut" fill="#767676" x="603.3" y="250" text-anchor="middle">26</text>
  <text class="lbl mut" fill="#767676" x="52" y="20">median excess January move in log points, the 32 prices that otherwise hold still</text>
  <text class="lbl mut" fill="#767676" x="52" y="282">Every other January averages -0.01. The two GST years are +0.68 and +0.45.</text>
</svg>
