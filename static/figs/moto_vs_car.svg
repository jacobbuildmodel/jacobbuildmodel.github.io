<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Line chart. Category A car premiums and Category D motorcycle premiums, both indexed to 100 in 2022. By 2026 the car index reaches 155 and the motorcycle index falls to 86. The two lines separate after 2022. The final point covers 15 exercises rather than a full year.">
