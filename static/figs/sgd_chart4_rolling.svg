<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 653" role="img" aria-labelledby="sgd-chart4-title sgd-chart4-desc">
<title id="sgd-chart4-title">In 39 of the 46 five-year stretches when the Singapore dollar gained on the yen, the yen's own fall was the larger part</title>
<desc id="sgd-chart4-desc">How to read: each point is one five-year window, placed at the month it ends; windows start every three months from August 2005, and each end is a three-month average. Blue: the Singapore dollar's own rise against all its trading partners, as a share of its rise against the yen. Grey: the yen's own fall against all of its partners, as a share of the same rise. The shares are of log changes; with the remainder they add to 100. The dashed line marks half. Shaded: windows in which the Singapore dollar did not rise against the yen, where no share is defined. Where the rise was tiny the shares run past the scale and are drawn at its edge, -50 or 150.</desc>
<style>:root{--fig-ink:#0b0b0b;--fig-ink-3:#717171;--fig-rule:#e2e1dd;--fig-surface:#fcfcfa;--fig-subject:#2873ce;--fig-context:#707379;}@media (prefers-color-scheme: dark){:root{--fig-ink:#ffffff;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}}:root[data-theme="dark"]{--fig-ink:#ffffff;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}</style>
