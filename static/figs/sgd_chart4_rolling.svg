<text x="16.0" y="70.0" font-size="16" fill="var(--fig-ink,#0b0b0b)" font-weight="600">on the yen, the yen's fall was the larger</text>
<text x="16.0" y="91.0" font-size="16" fill="var(--fig-ink,#0b0b0b)" font-weight="600">part</text>
