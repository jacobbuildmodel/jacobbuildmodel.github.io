<text x="16.0" y="423.0" font-size="14" fill="var(--fig-ink-3,#717171)">months from August 2005, and each end is a three-month</text>
<text x="16.0" y="442.0" font-size="14" fill="var(--fig-ink-3,#717171)">average. Blue: the Singapore dollar's own rise against</text>
<text x="16.0" y="461.0" font-size="14" fill="var(--fig-ink-3,#717171)">all its trading partners, as a share of its rise</text>
<text x="16.0" y="480.0" font-size="14" fill="var(--fig-ink-3,#717171)">against the yen. Grey: the yen's own fall against all</text>
<text x="16.0" y="499.0" font-size="14" fill="var(--fig-ink-3,#717171)">of its partners, as a share of the same rise. The</text>
