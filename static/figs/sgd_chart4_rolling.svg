<text x="16.0" y="406.0" font-size="14" fill="var(--fig-ink-3,#717171)">How to read: each point is one five-year window,</text>
<text x="16.0" y="425.0" font-size="14" fill="var(--fig-ink-3,#717171)">placed at the month it ends; windows start every three</text>
<text x="16.0" y="444.0" font-size="14" fill="var(--fig-ink-3,#717171)">months from August 2005, and each end is a three-month</text>
<text x="16.0" y="463.0" font-size="14" fill="var(--fig-ink-3,#717171)">average. The windows overlap: only four five-year</text>
<text x="16.0" y="482.0" font-size="14" fill="var(--fig-ink-3,#717171)">stretches fit end to end without overlapping. Blue:</text>
<text x="16.0" y="501.0" font-size="14" fill="var(--fig-ink-3,#717171)">the Singapore dollar's rise against its trading</text>
<text x="16.0" y="520.0" font-size="14" fill="var(--fig-ink-3,#717171)">partners, as a share of its rise against the yen.</text>
<text x="16.0" y="539.0" font-size="14" fill="var(--fig-ink-3,#717171)">Grey: the yen's fall against its trading partners, as</text>
<text x="16.0" y="558.0" font-size="14" fill="var(--fig-ink-3,#717171)">a share of the same rise. The shares are of log</text>
<text x="16.0" y="577.0" font-size="14" fill="var(--fig-ink-3,#717171)">changes; with the remainder they add to 100. The</text>
<text x="16.0" y="596.0" font-size="14" fill="var(--fig-ink-3,#717171)">dashed line marks half. Shaded: windows in which the</text>
