<text x="16.0" y="28.0" font-size="16" fill="var(--fig-ink,#0b0b0b)" font-weight="600">Yen: mostly the yen's own fall. Ringgit:</text>
<text x="16.0" y="49.0" font-size="16" fill="var(--fig-ink,#0b0b0b)" font-weight="600">mostly the Singapore dollar's own rise.</text>
<line x1="214.0" x2="214.0" y1="84" y2="308" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="214.0" y="326.0" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">-40</text>
