<text x="16.0" y="70.0" font-size="16" fill="var(--fig-ink,#0b0b0b)" font-weight="600">Singapore dollar rising against its trading</text>
<text x="16.0" y="91.0" font-size="16" fill="var(--fig-ink,#0b0b0b)" font-weight="600">partners.</text>
