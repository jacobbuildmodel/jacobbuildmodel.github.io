<text x="310.0" y="287.0" font-size="14" fill="var(--fig-ink,#0b0b0b)">up 5%</text>
<text x="16.0" y="352.0" font-size="14" fill="var(--fig-ink-3,#717171)">How to read: each bar is a move in per cent, from the</text>
<text x="16.0" y="371.0" font-size="14" fill="var(--fig-ink-3,#717171)">average of January to March 2021 to the average of</text>
<text x="16.0" y="390.0" font-size="14" fill="var(--fig-ink-3,#717171)">October to December 2025. Blue, "Singapore dollar vs</text>
<text x="16.0" y="409.0" font-size="14" fill="var(--fig-ink-3,#717171)">all": the Singapore dollar against all its trading</text>
<text x="16.0" y="428.0" font-size="14" fill="var(--fig-ink-3,#717171)">partners. Grey, "yen vs all" or "ringgit vs all": the</text>
<text x="16.0" y="447.0" font-size="14" fill="var(--fig-ink-3,#717171)">other currency against its own trading partners.</text>
<text x="16.0" y="466.0" font-size="14" fill="var(--fig-ink-3,#717171)">Outlined, "Singapore dollar vs yen" or "vs ringgit":</text>
<text x="16.0" y="485.0" font-size="14" fill="var(--fig-ink-3,#717171)">the Singapore dollar against that one currency. The</text>
<text x="16.0" y="504.0" font-size="14" fill="var(--fig-ink-3,#717171)">moves compound rather than add, and a remainder that</text>
<text x="16.0" y="523.0" font-size="14" fill="var(--fig-ink-3,#717171)">neither "vs all" move explains makes up the</text>
<text x="16.0" y="542.0" font-size="14" fill="var(--fig-ink-3,#717171)">difference. Right of the line is a rise, left a fall.</text>
</svg>
