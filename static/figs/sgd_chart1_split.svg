<text x="16.0" y="508.0" font-size="14" fill="var(--fig-ink-3,#717171)">trading partners (BIS broad index). Outlined,</text>
<text x="16.0" y="527.0" font-size="14" fill="var(--fig-ink-3,#717171)">"Singapore dollar vs yen" or "vs ringgit": the</text>
<text x="16.0" y="546.0" font-size="14" fill="var(--fig-ink-3,#717171)">Singapore dollar against that one currency. The moves</text>
<text x="16.0" y="565.0" font-size="14" fill="var(--fig-ink-3,#717171)">compound rather than add, and a remainder that neither</text>
<text x="16.0" y="584.0" font-size="14" fill="var(--fig-ink-3,#717171)">"vs all" move explains makes up the difference. Right</text>
