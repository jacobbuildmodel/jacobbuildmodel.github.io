<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 635" role="img" aria-labelledby="sgd-chart1-title sgd-chart1-desc">
<title id="sgd-chart1-title">Yen: mostly the yen falling against its trading partners. Ringgit: mostly the Singapore dollar rising against its trading partners.</title>
<desc id="sgd-chart1-desc">How to read: each bar is a move in per cent, from the average of January to March 2021 to the average of October to December 2025. Blue, "Singapore dollar vs all": the Singapore dollar against its trading partners (BIS broad index). Grey, "yen vs all" or "ringgit vs all": the other currency against its trading partners (BIS broad index). Outlined, "Singapore dollar vs yen" or "vs ringgit": the Singapore dollar against that one currency. The moves compound rather than add, and a remainder that neither "vs all" move explains makes up the difference. Right of the line is a rise, left a fall.</desc>
<style>:root{--fig-ink:#0b0b0b;--fig-ink-3:#717171;--fig-rule:#e2e1dd;--fig-surface:#fcfcfa;--fig-subject:#2873ce;--fig-context:#707379;}@media (prefers-color-scheme: dark){:root{--fig-ink:#ffffff;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}}:root[data-theme="dark"]{--fig-ink:#ffffff;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}</style>
