<text x="414.0" y="326.0" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">60</text>
<line x1="294.0" x2="294.0" y1="84" y2="308" stroke="var(--fig-ink-3,#717171)" stroke-width="1"/>
<text x="16.0" y="100.0" font-size="14" fill="var(--fig-ink,#0b0b0b)" font-weight="600">The yen</text>
<text x="206.0" y="123.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)">Singapore dollar vs all</text>
