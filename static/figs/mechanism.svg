<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" role="img" aria-label="Diagram of the mechanism. Supply is a vertical line because the quota is fixed before bidding opens. Between 2010 and 2026 that line moved right by 62 percent, which on its own would have slid the price down the old demand curve to a lower point. The demand curve moved up and out by more than that, so the clearing price rose from about 30,000 dollars to about 118,000.">
