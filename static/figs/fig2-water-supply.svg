<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Bar chart of the month-on-month change in Singapore's water supply consumer price index into each January from 2016 to 2026. Nine of the eleven Januaries show a change of exactly zero and are drawn as flat ticks on the baseline. The two exceptions are January 2023 at plus 1.02 per cent and January 2024 at plus 0.97 per cent, the two months the GST rate rose. A reference line marks 0.93 per cent, the amount the tax rise alone should add, and both bars sit just above it. PUB last revised the water price in 2017 and next in April 2024 and April 2025, so no January in this chart contains a tariff decision." style="max-width:100%;height:auto">
  <style>
    :root{--fig-ink:#0b0b0b;--fig-ink-2:#52514e;--fig-ink-3:#717171;--fig-rule:#e2e1dd;
      --fig-surface:#fcfcfa;--fig-subject:#2873ce;--fig-context:#707379;}
    @media (prefers-color-scheme: dark){
      :root{--fig-ink:#ffffff;--fig-ink-2:#c3c2b7;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;
        --fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}
    }
    :root[data-theme="dark"]{--fig-ink:#ffffff;--fig-ink-2:#c3c2b7;--fig-ink-3:#9a9a9a;
      --fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}
    text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
    .fg{fill:var(--fig-ink,#0b0b0b)} .mut{fill:var(--fig-ink-3,#717171)}
    .lbl{font-size:14px} .lbl-b{font-size:14px;font-weight:600}
    .grid{stroke:var(--fig-rule,#e2e1dd);stroke-width:1;fill:none}
    .axis{stroke:var(--fig-ink-3,#717171);stroke-width:1;fill:none}
    .ctx{fill:var(--fig-context,#707379)} .ctxs{stroke:var(--fig-context,#707379)}
    .acc{fill:var(--fig-subject,#2873ce)} .accs{stroke:var(--fig-subject,#2873ce)}
  </style>
  <line class="grid" stroke="#e2e1dd" x1="48" y1="212.1" x2="462" y2="212.1"/>
  <text class="lbl mut" fill="#717171" x="40" y="216.1" text-anchor="end" font-variant-numeric="tabular-nums">0.00%</text>
  <line class="grid" stroke="#e2e1dd" x1="48" y1="178.8" x2="462" y2="178.8"/>
  <text class="lbl mut" fill="#717171" x="40" y="182.8" text-anchor="end" font-variant-numeric="tabular-nums">0.25%</text>
  <line class="grid" stroke="#e2e1dd" x1="48" y1="145.6" x2="462" y2="145.6"/>
  <text class="lbl mut" fill="#717171" x="40" y="149.6" text-anchor="end" font-variant-numeric="tabular-nums">0.50%</text>
  <line class="grid" stroke="#e2e1dd" x1="48" y1="112.4" x2="462" y2="112.4"/>
  <text class="lbl mut" fill="#717171" x="40" y="116.4" text-anchor="end" font-variant-numeric="tabular-nums">0.75%</text>
  <line class="grid" stroke="#e2e1dd" x1="48" y1="79.2" x2="462" y2="79.2"/>
  <text class="lbl mut" fill="#717171" x="40" y="83.2" text-anchor="end" font-variant-numeric="tabular-nums">1.00%</text>
  <line class="grid" stroke="#e2e1dd" x1="48" y1="46.0" x2="462" y2="46.0"/>
  <text class="lbl mut" fill="#717171" x="40" y="50.0" text-anchor="end" font-variant-numeric="tabular-nums">1.25%</text>
  <line class="accs" stroke="#2873ce" x1="48" y1="87.9" x2="462" y2="87.9" stroke-width="1.5"/>
  <text class="lbl-b acc" fill="#2873ce" x="48" y="79.9">what the tax alone should add, 0.93%</text>
  <line class="axis" stroke="#717171" x1="48" y1="212.1" x2="462" y2="212.1"/>
  <line class="ctxs" stroke="#707379" x1="57.4" y1="212.1" x2="76.2" y2="212.1" stroke-width="2.5"/>
  <text class="lbl mut" fill="#717171" x="66.8" y="248" text-anchor="middle">16</text>
  <line class="ctxs" stroke="#707379" x1="95.0" y1="212.1" x2="113.9" y2="212.1" stroke-width="2.5"/>
  <text class="lbl mut" fill="#717171" x="104.5" y="248" text-anchor="middle">17</text>
  <line class="ctxs" stroke="#707379" x1="132.7" y1="212.1" x2="151.5" y2="212.1" stroke-width="2.5"/>
  <text class="lbl mut" fill="#717171" x="142.1" y="248" text-anchor="middle">18</text>
  <line class="ctxs" stroke="#707379" x1="170.3" y1="212.1" x2="189.1" y2="212.1" stroke-width="2.5"/>
  <text class="lbl mut" fill="#717171" x="179.7" y="248" text-anchor="middle">19</text>
  <line class="ctxs" stroke="#707379" x1="208.0" y1="212.1" x2="226.8" y2="212.1" stroke-width="2.5"/>
  <text class="lbl mut" fill="#717171" x="217.4" y="248" text-anchor="middle">20</text>
  <line class="ctxs" stroke="#707379" x1="245.6" y1="212.1" x2="264.4" y2="212.1" stroke-width="2.5"/>
  <text class="lbl mut" fill="#717171" x="255.0" y="248" text-anchor="middle">21</text>
  <line class="ctxs" stroke="#707379" x1="283.2" y1="212.1" x2="302.0" y2="212.1" stroke-width="2.5"/>
  <text class="lbl mut" fill="#717171" x="292.6" y="248" text-anchor="middle">22</text>
  <rect class="acc" fill="#2873ce" x="320.9" y="76.1" width="18.8" height="135.9"/>
  <text class="lbl-b acc" fill="#2873ce" x="330.3" y="68.1" text-anchor="middle">1.02%</text>
  <text class="lbl mut" fill="#717171" x="330.3" y="248" text-anchor="middle">23</text>
  <rect class="acc" fill="#2873ce" x="358.5" y="82.7" width="18.8" height="129.3"/>
  <text class="lbl-b acc" fill="#2873ce" x="367.9" y="74.7" text-anchor="middle">0.97%</text>
  <text class="lbl mut" fill="#717171" x="367.9" y="248" text-anchor="middle">24</text>
  <line class="ctxs" stroke="#707379" x1="396.1" y1="212.1" x2="415.0" y2="212.1" stroke-width="2.5"/>
  <text class="lbl mut" fill="#717171" x="405.5" y="248" text-anchor="middle">25</text>
  <line class="ctxs" stroke="#707379" x1="433.8" y1="212.1" x2="452.6" y2="212.1" stroke-width="2.5"/>
  <text class="lbl mut" fill="#717171" x="443.2" y="248" text-anchor="middle">26</text>
  <text class="lbl mut" fill="#717171" x="48" y="24">water supply price, change into each January</text>
  <text class="lbl mut" fill="#717171" x="48" y="280">Nine Januaries at exactly zero. Two at the size of the tax.</text>
  <text class="lbl mut" fill="#717171" x="48" y="296">PUB last revised the price in 2017, then in April 2024 and April 2025.</text>
</svg>
