<line x1="160.4" y1="82" x2="577.9" y2="82" stroke="var(--fig-rule,#dfdeda)" stroke-width="6" stroke-linecap="round"/>
<circle cx="160.4" cy="108" r="7" fill="var(--fig-surface,#fbfaf8)" stroke="var(--fig-context,#8d9096)" stroke-width="2.6"/>
<circle cx="577.9" cy="108" r="8.5" fill="var(--fig-subject,#a32a1e)"/>
