<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 210" role="img" aria-label="Number line. What the 62 percent quota increase alone predicts for the Category A premium is a fall of 13.6 percent, just left of zero. What actually happened is a rise of 287 percent, at the far right of the scale." font-family="IBM Plex Sans, system-ui, sans-serif">
<line x1="96" y1="108" x2="596" y2="108" stroke="var(--fig-rule,#dfdeda)" stroke-width="1.5"/>
