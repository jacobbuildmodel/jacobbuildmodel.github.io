<text x="387.7" y="130" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-3,#8d9096)" font-variant-numeric="tabular-nums">+150%</text>
<line x1="457.1" y1="104" x2="457.1" y2="112" stroke="var(--fig-ink-3,#8d9096)" stroke-width="1"/>
