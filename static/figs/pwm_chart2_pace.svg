<text x="16.0" y="49.0" font-size="16" fill="var(--fig-ink,#0b0b0b)" font-weight="600">bottom pay grew 4.6 per cent less than the</text>
<text x="16.0" y="70.0" font-size="16" fill="var(--fig-ink,#0b0b0b)" font-weight="600">median</text>
