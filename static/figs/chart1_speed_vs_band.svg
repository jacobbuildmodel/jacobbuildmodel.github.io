<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" role="img" aria-label="Two-panel chart. Top: average peak-hour speed on expressways and arterial roads each year from 2004 to 2025, against LTA's target bands of 45 to 65 and 20 to 30 km/h. Expressway speed stays inside its band every year. Arterial speed runs above 30 km/h in 2016 and 2023 among the scored years, and in 2020 and 2021, which are not scored. Bottom: cars per lane-kilometre, 2005 = 100, rising by about a quarter on both road types from 2005 to 2017.">
