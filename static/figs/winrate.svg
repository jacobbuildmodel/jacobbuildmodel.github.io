<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" role="img" aria-label="Line chart. The share of Category A COE bids that succeed, by year, from 2010 to 2026. The line stays between 54 and 75 percent for the whole period, close to a flat average of 67 percent, while the premium over the same years moved by a factor of almost four.">
<style>:root{--fig-ink:#0b0b0b;--fig-ink-2:#52514e;--fig-ink-3:#717171;--fig-rule:#e2e1dd;--fig-surface:#fcfcfa;--fig-subject:#2873ce;--fig-context:#707379;}@media (prefers-color-scheme: dark){:root{--fig-ink:#ffffff;--fig-ink-2:#c3c2b7;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}}:root[data-theme="dark"]{--fig-ink:#ffffff;--fig-ink-2:#c3c2b7;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}</style>
<line x1="54" y1="200.0" x2="350" y2="200.0" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="46" y="205.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)" font-variant-numeric="tabular-nums">0%</text>
<line x1="54" y1="158.0" x2="350" y2="158.0" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="46" y="163.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)" font-variant-numeric="tabular-nums">25%</text>
<line x1="54" y1="116.0" x2="350" y2="116.0" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="46" y="121.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)" font-variant-numeric="tabular-nums">50%</text>
<line x1="54" y1="74.0" x2="350" y2="74.0" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="46" y="79.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)" font-variant-numeric="tabular-nums">75%</text>
<line x1="54" y1="32.0" x2="350" y2="32.0" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="46" y="37.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)" font-variant-numeric="tabular-nums">100%</text>
<rect x="54" y="74.1" width="296" height="35.6" fill="var(--fig-context,#707379)" opacity="0.13"/>
<text x="344" y="65.1" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)">every year sits inside this band</text>
<text x="54.0" y="220" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">2010</text>
<text x="146.5" y="220" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">2015</text>
<text x="239.0" y="220" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">2020</text>
<text x="350.0" y="220" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">2026</text>
<polyline points="54.0,83.4 72.5,98.0 91.0,84.8 109.5,109.7 128.0,101.6 146.5,85.8 165.0,88.0 183.5,74.1 202.0,75.8 220.5,80.0 239.0,92.0 257.5,79.8 276.0,81.1 294.5,78.4 313.0,92.4 331.5,89.1 350.0,91.5" fill="none" stroke="var(--fig-subject,#2873ce)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="350.0" cy="91.5" r="4.5" fill="var(--fig-subject,#2873ce)"/>
<text x="360" y="93.5" font-size="16" fill="var(--fig-subject,#2873ce)" font-weight="600">65% in 2026</text>
<text x="360" y="110.5" font-size="14" fill="var(--fig-ink-3,#717171)">67% on average</text>
<text x="54" y="242" font-size="14" fill="var(--fig-ink-3,#717171)">Share of Category A bids that succeeded, annual</text>
<text x="54" y="258" font-size="14" fill="var(--fig-ink-3,#717171)">means of 24 bidding exercises.</text>
<text x="54" y="280" font-size="14" fill="var(--fig-ink-3,#717171)">Over the same years the average premium ran from</text>
<text x="54" y="296" font-size="14" fill="var(--fig-ink-3,#717171)">$29,907 to $117,548.</text>
</svg>
