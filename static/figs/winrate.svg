<text x="512.0" y="267" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-3,#8d9096)">2026</text>
<polyline points="56.0,106.5 84.5,124.2 113.0,108.1 141.5,138.3 170.0,128.5 198.5,109.3 227.0,112.0 255.5,95.1 284.0,97.2 312.5,102.3 341.0,116.9 369.5,102.1 398.0,103.7 426.5,100.4 455.0,117.4 483.5,113.4 512.0,116.2" fill="none" stroke="var(--fig-subject,#a32a1e)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
