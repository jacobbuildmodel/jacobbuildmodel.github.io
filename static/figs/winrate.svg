<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" role="img" aria-label="Line chart. The share of Category A COE bids that succeed, by year, from 2010 to 2026. The line stays between 54 and 75 percent for the whole period, close to a flat average of 67 percent, while the premium over the same years moved by a factor of almost four." font-family="IBM Plex Sans, system-ui, sans-serif">
