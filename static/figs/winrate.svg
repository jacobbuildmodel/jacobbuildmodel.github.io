<text x="56" y="294" font-size="11" fill="var(--fig-ink-3,#8d9096)">Share of Category A bids that succeeded, annual means of 24 bidding exercises.</text>
<text x="56" y="309" font-size="11" fill="var(--fig-ink-3,#8d9096)">Over the same years the average premium ran from $29,907 to $117,548.</text>
