<text x="34" y="205.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)" font-variant-numeric="tabular-nums">0%</text>
<line x1="42" y1="158.0" x2="358" y2="158.0" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="34" y="163.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)" font-variant-numeric="tabular-nums">25%</text>
<line x1="42" y1="116.0" x2="358" y2="116.0" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="34" y="121.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)" font-variant-numeric="tabular-nums">50%</text>
<line x1="42" y1="74.0" x2="358" y2="74.0" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="34" y="79.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)" font-variant-numeric="tabular-nums">75%</text>
<line x1="42" y1="32.0" x2="358" y2="32.0" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="34" y="37.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)" font-variant-numeric="tabular-nums">100%</text>
<rect x="42" y="74.1" width="316" height="35.6" fill="var(--fig-context,#707379)" opacity="0.13"/>
<text x="352" y="65.1" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)">every year sits inside this band</text>
<text x="42.0" y="220" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">2010</text>
<text x="140.8" y="220" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">2015</text>
<text x="239.5" y="220" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">2020</text>
<text x="358.0" y="220" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">2026</text>
<polyline points="42.0,83.4 61.8,98.0 81.5,84.8 101.2,109.7 121.0,101.6 140.8,85.8 160.5,88.0 180.2,74.1 200.0,75.8 219.8,80.0 239.5,92.0 259.2,79.8 279.0,81.1 298.8,78.4 318.5,92.4 338.2,89.1 358.0,91.5" fill="none" stroke="var(--fig-subject,#2873ce)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="358.0" cy="91.5" r="4.5" fill="var(--fig-subject,#2873ce)"/>
<text x="368" y="93.5" font-size="16" fill="var(--fig-subject,#2873ce)" font-weight="600">65% in 2026</text>
<text x="368" y="110.5" font-size="14" fill="var(--fig-ink-3,#717171)">67% on average</text>
<text x="42" y="242" font-size="14" fill="var(--fig-ink-3,#717171)">Share of Category A bids that succeeded, annual means of 24</text>
<text x="42" y="258" font-size="14" fill="var(--fig-ink-3,#717171)">bidding exercises.</text>
<text x="42" y="280" font-size="14" fill="var(--fig-ink-3,#717171)">Over the same years the average premium ran from $29,907 to</text>
