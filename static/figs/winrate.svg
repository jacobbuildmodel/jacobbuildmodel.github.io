<text x="48" y="252.0" text-anchor="end" font-size="10.5" fill="var(--fig-ink-3,#8d9096)" font-variant-numeric="tabular-nums">0%</text>
<line x1="56" y1="197.0" x2="512" y2="197.0" stroke="var(--fig-rule,#dfdeda)" stroke-width="1"/>
<text x="48" y="201.0" text-anchor="end" font-size="10.5" fill="var(--fig-ink-3,#8d9096)" font-variant-numeric="tabular-nums">25%</text>
<line x1="56" y1="146.0" x2="512" y2="146.0" stroke="var(--fig-rule,#dfdeda)" stroke-width="1"/>
<text x="48" y="150.0" text-anchor="end" font-size="10.5" fill="var(--fig-ink-3,#8d9096)" font-variant-numeric="tabular-nums">50%</text>
<line x1="56" y1="95.0" x2="512" y2="95.0" stroke="var(--fig-rule,#dfdeda)" stroke-width="1"/>
<text x="48" y="99.0" text-anchor="end" font-size="10.5" fill="var(--fig-ink-3,#8d9096)" font-variant-numeric="tabular-nums">75%</text>
<line x1="56" y1="44.0" x2="512" y2="44.0" stroke="var(--fig-rule,#dfdeda)" stroke-width="1"/>
<text x="48" y="48.0" text-anchor="end" font-size="10.5" fill="var(--fig-ink-3,#8d9096)" font-variant-numeric="tabular-nums">100%</text>
<rect x="56" y="95.1" width="456" height="43.2" fill="var(--fig-context,#8d9096)" opacity="0.13"/>
<text x="506" y="88.1" text-anchor="end" font-size="10.5" fill="var(--fig-ink-3,#8d9096)">every year sits inside this band</text>
<text x="56.0" y="267" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-3,#8d9096)">2010</text>
<text x="170.0" y="267" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-3,#8d9096)">2014</text>
