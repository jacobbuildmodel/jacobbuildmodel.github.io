# ============================================================
#  SITE CONFIG
#  Only the lines marked  # EDIT  need changing.
# ============================================================

baseURL        = "https://jacobbuildmodel.github.io/"
languageCode   = "en-us"
title          = "Jacob | Market Research"          # EDIT — your public site name
enableRobotsTXT = true
buildDrafts    = false
buildFuture    = false
pagination.pagerSize = 10

# --- theme (pulled automatically at build time, no files to download) ---
[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

# --- taxonomies ---
# Sector lets a reader who came for one company find the next one. "tag" is kept
# because existing content already uses it.
[taxonomies]
  tag    = "tags"
  sector = "sectors"

# --- markdown rendering ---
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3

# --- site parameters ---
[params]
  env         = "production"
  author      = "Jacob Ong"
  description = "Weekly market analysis: flows, regime, forward catalysts, and a research watchlist. Reasoning, not recommendations."
  keywords    = ["market analysis", "equity research", "fund flows", "macro"]
  mainSections = ["economics"]

  DateFormat        = "2 January 2006"
  ShowReadingTime   = true
  ShowToc           = true
  TocOpen           = false
  ShowBreadCrumbs   = true
  ShowPostNavLinks  = true
  ShowWordCount     = false
  ShowCodeCopyButtons = false
  ShowShareButtons  = false
  ShowRssButtonInSectionTermList = true
  defaultTheme      = "auto"
  disableThemeToggle = false

  # Homepage intro block
  [params.homeInfoParams]
    Title   = "Singapore policy, measured with public data."
    Content = """
Questions people argue about, put next to the actual data. What drives COE prices,
whether the quota lever works, and what the numbers can and cannot settle.

Every figure comes from a public source, every claim carries the observation that
would prove it wrong, and the code behind each piece is published so you can run it
yourself.

[Read the research](/economics/) &nbsp;·&nbsp; [How it works](/process/)
"""

  [[params.socialIcons]]
    name = "github"
    url  = "https://github.com/jacobbuildmodel"
  # [[params.socialIcons]]                            # EDIT — uncomment and add your LinkedIn
  #   name = "linkedin"
  #   url  = "https://www.linkedin.com/in/YOUR-SLUG/"
  [[params.socialIcons]]
    name = "rss"
    url  = "/index.xml"

  # Analytics — paste your Umami Website ID here after Step 4. Blank = disabled.
  [params.analytics]
    [params.analytics.umami]
      websiteId = "974c6f9a-3122-464c-947f-b581d838adec"
      scriptUrl = "https://cloud.umami.is/script.js"

  # Newsletter — paste your Buttondown username here after Step 5. Blank = disabled.
  [params.newsletter]
    buttondownUsername = ""                           # EDIT LATER

# --- navigation ---
[[menu.main]]
