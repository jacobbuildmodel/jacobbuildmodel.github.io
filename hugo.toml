# ============================================================
#  SITE CONFIG
#  Only the lines marked  # EDIT  need changing.
# ============================================================

baseURL        = "https://jacobbuildmodel.github.io/"
languageCode   = "en-us"
title          = "The New Void Deck"          # EDIT - your public site name
enableRobotsTXT = true
buildDrafts    = false
buildFuture    = false
pagination.pagerSize = 10

# --- theme (pulled automatically at build time, no files to download) ---
[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

# --- taxonomies ---
# Sector lets a reader who came for one company find the next one. "tag" is kept
# because existing content already uses it.
[taxonomies]
  tag    = "tags"
  sector = "sectors"

# /sectors/... and /tags/stocks/ exist only because of the archived stocks
# pages: kept at their URLs, but out of the sitemap and noindex, like the
# stocks pages themselves (whose cascade lives in content/stocks/_index.md).
# Out of RSS as well: no feed of their own (outputs html only), and not
# listed in the /tags/ feed (hiddenInRss).
[[cascade]]
  robotsNoIndex = true
  hiddenInRss   = true
  outputs       = ["html"]
  [cascade.sitemap]
    disable = true
  [cascade.target]
    path = "{/sectors,/sectors/**,/tags/stocks}"

# --- markdown rendering ---
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3

# --- site parameters ---
[params]
  env         = "production"
  author      = "Jacob Ong"
  # Reused verbatim from the live homepage intro (params.homeInfoParams.Title
  # below) rather than composed fresh -- Jacob's own already-published words,
  # picked over the old copy which still described deleted sections (NEWS,
  # SECTOR, STANDOUTS) and a "weekly market analysis" format that no longer
  # exists.
  description = "Singapore's favourite arguments, tested with public data."
  keywords    = ["Singapore economics", "COE", "HDB", "GST", "public data"]
  mainSections = ["economics"]

  DateFormat        = "2 January 2006"
  ShowReadingTime   = true
  ShowToc           = true
  TocOpen           = false
  ShowBreadCrumbs   = true
  ShowPostNavLinks  = true
  ShowWordCount     = false
  ShowCodeCopyButtons = false
  ShowShareButtons  = false
  ShowRssButtonInSectionTermList = true
  defaultTheme      = "auto"
  disableThemeToggle = false
  # "Jacob Ong" now appears once, in the masthead (layouts/partials/header.html),
  # reading this same author value. Suppressing it from every card/article meta
  # line removes the repetition without adding a second source of the name.
  hideAuthor        = true

  # Homepage intro block
  # Home page welcome (layouts/partials/welcome_home.html). Final words,
  # approved by Jacob on 28 Oct 2026; the byline names the author under the
  # H1, on the home page only.
  [params.welcome]
    byline  = "Jacob Ong: economics with a scorecard"
    promise = "Singapore's favourite arguments, tested with public data. Before I open the data, I write down my prediction and seal it."

  # The question form on /connect/ posts to Web3Forms. The access key is public
  # by design (it only routes a message to Jacob's inbox). Empty = the form is
  # shown disabled with "The form opens soon."
  [params.web3forms]
    accessKey = "ffcb89cd-89b8-4d1c-a407-005bf58ea8ac"

  [params.homeInfoParams]
    Title   = "Singapore's favourite arguments, tested with public data."
    Content = """
COE prices, HDB flats, the GST rise: everyone has a view. Each piece here
takes one of those arguments, names what would prove it wrong, and checks
it against the government's own numbers. When a prediction fails, the
failure is published too.

[Read the research](/economics/) &nbsp;·&nbsp; [How it works](/process/)
"""

  [[params.socialIcons]]
    name = "github"
    url  = "https://github.com/jacobbuildmodel"
  # [[params.socialIcons]]                            # EDIT — uncomment and add your LinkedIn
  #   name = "linkedin"
  #   url  = "https://www.linkedin.com/in/YOUR-SLUG/"
  [[params.socialIcons]]
    name = "rss"
    url  = "/index.xml"

  # Analytics — paste your Umami Website ID here after Step 4. Blank = disabled.
  [params.analytics]
    [params.analytics.umami]
      websiteId = "974c6f9a-3122-464c-947f-b581d838adec"
      scriptUrl = "https://cloud.umami.is/script.js"

  # Newsletter — paste your Buttondown username here after Step 5. Blank = disabled.
  [params.newsletter]
    buttondownUsername = ""                           # EDIT LATER

# --- navigation ---
# Stocks is archived: off the menu, pages kept at their URLs (noindex, banner).
[[menu.main]]
  identifier = "economics"
  name       = "Economics"
  url        = "/economics/"
  weight     = 1
[[menu.main]]
  identifier = "process"
  name       = "How it works"
  url        = "/process/"
  weight     = 40
[[menu.main]]
  identifier = "about"
  name       = "About"
  url        = "/about/"
  weight     = 50
# No menu item for the question page: "Questions" does not fit on one menu
# line at 360px (the menu scrolls sideways; checked 28 Oct 2026). It is
# reached from the home page's third door, the line at the end of every
# article, and the "Questions and counter-arguments" link on every page.
