{{- $v := .Get "value" | lower -}}
<div class="attr-row">
  <div class="attr-head">
    <span class="attr-label">{{ .Get "label" }}</span>
    <span class="attr-word attr-{{ replaceRE "[^a-z]" "" $v }}">{{ .Get "value" }}</span>
  </div>
  {{- with .Get "why" }}<div class="attr-why">{{ . }}</div>{{ end -}}
</div>
