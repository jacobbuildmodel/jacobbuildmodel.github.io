{{- $v := .Get "value" | lower -}}
<div class="attr-row">
  <div class="attr-head">
    <span class="attr-label">{{ .Get "label" | default "Statement integrity" }}</span>
    <span class="attr-word attr-{{ replaceRE "[^a-z]" "" $v }}">{{ .Get "value" }}</span>
  </div>
  {{- with .Get "flagged" }}<div class="attr-why"><strong>Flagged:</strong> {{ . }}</div>{{ end -}}
  {{- with .Get "passed" }}<div class="attr-why"><strong>Checks that passed:</strong> {{ . }}</div>{{ end -}}
</div>
