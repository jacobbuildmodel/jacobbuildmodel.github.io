{{- with site.Params.analytics.umami }}
  {{- if .websiteId }}
<script defer src="{{ .scriptUrl | default "https://cloud.umami.is/script.js" }}" data-website-id="{{ .websiteId }}"></script>
  {{- end }}
{{- end }}

<!-- Social preview tags (og:*, twitter:*) live in the overridden
     templates/opengraph.html and templates/twitter_cards.html, with a
     per-page card from share_card.html. The old site-wide og:image here
     would have been a second, conflicting image tag. -->

<!-- Fonts are self-hosted (static/fonts/, @font-face in
     assets/css/extended/00-tokens.css); no request goes to Google Fonts.
     Since 12 November 2026: Newsreader (serif), Inter (sans) and the digits
     of JetBrains Mono.
     Preloaded: the two Regular faces, which carry the reading text and the
     interface on every page, and the sans Semibold, which carries the
     masthead wordmark on every page (without it the wordmark swapped in
     after first paint and moved the tagline and the theme toggle; fix
     round 1, 5 November 2026). About 71 KB for the three. On single pages
     also the serif Semibold, which carries the headline, and, where
     layouts/single.html shows the dek (.Params.summary, not on the connect
     layout), the serif Italic: both are above the fold there, and swapping
     in late they moved the text under them. Each face is preloaded only
     where the page uses it. The two digit files (1.2 KB each) are not
     preloaded: until they arrive the digits are drawn by Inter on the same
     line. The URLs match the @font-face src exactly, so each file is
     fetched once. Layout shift measured after the change:
     office/type-lab/DESIGN_NOTE.md. -->
<link rel="preload" href="/fonts/newsreader-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
{{- if eq .Kind "page" }}
<link rel="preload" href="/fonts/newsreader-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
{{- if and .Params.summary (ne .Layout "connect") }}
<link rel="preload" href="/fonts/newsreader-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
{{- end }}
{{- end }}
