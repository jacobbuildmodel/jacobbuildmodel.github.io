{{- with site.Params.analytics.umami }}
  {{- if .websiteId }}
<script defer src="{{ .scriptUrl | default "https://cloud.umami.is/script.js" }}" data-website-id="{{ .websiteId }}"></script>
  {{- end }}
{{- end }}

<!-- Social preview tags (og:*, twitter:*) live in the overridden
     templates/opengraph.html and templates/twitter_cards.html, with a
     per-page card from share_card.html. The old site-wide og:image here
     would have been a second, conflicting image tag. -->

<!-- Reading serif for .post-content prose only -- nav, meta and labels stay in
     the theme's system sans so UI chrome and reading type stay visually
     distinct. Source Serif 4, a Google Fonts variable face designed for long
     text; two static weights only, subsetted to latin. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap&subset=latin" rel="stylesheet">
