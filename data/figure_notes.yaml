# Notes and Sources under every figure (27 October 2026).
#
# One line per figure, shown directly under it by layouts/single.html, and the
# article's changelog, shown at its end by layouts/partials/page_changelog.html:
# one line, or a list of lines, newest first (29 October 2026).
# Keyed by section, then the article's file name, then the figure's src.
# Kept here, not in the articles, so no article body is edited to carry them.
#
# Every word is taken from the article itself or its repository's README; the
# line each fact came from is listed in the pull request that added this file.
# A fact not stated anywhere is left out, not supplied. Pure ASCII.

