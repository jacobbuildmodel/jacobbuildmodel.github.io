# Vale prose checks (github.com/errata-ai/vale), run over content/**/*.md by
# .github/workflows/lint.yml. The rules live in styles/Site/:
#   error   Directives  choose, should, recommend, better option, you should
#   error   We          "we" and its contractions: this is one person's research
#   error   Jargon      log point(s), yardstick, pass-through
#   error   Acronyms    SORA, T1-T5 (case-sensitive, so "sora" or "t1" in a
#                       URL-like token is not caught by accident)
#   warning Causal      lifted, caused, drove, led to: not banned, but each
#                       one is a causal claim the checker should look at
# Vale skips code and link targets by itself. It does read front matter here,
# and that is kept: title and summary are what a reader sees on every card.
# Ignored below: Hugo shortcodes, so their parameter names are never read as
# prose, and URLs and github.com/... repo paths written as text in the body.
# TokenIgnores does not reach front matter, which is why Jargon lists only
# "pass-through" and not "passthrough": the gst-passthrough repo name in a
# repo: field is not a use of the word.

StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Site
TokenIgnores = (\{\{[<%].*?[%>]\}\}), (https?://[^\s)"\]]+), (github\.com/[^\s)"\]]+)

# The researcher companion to the Singapore dollar piece: T1-T4 are the sealed
# test labels, and four of them sit inside a verbatim THESIS quote, so
# Acronyms is switched off for this one file only. Every other rule still
# applies to it, and the article itself is checked in full.
[content/researchers/singapore-dollar.md]
Site.Acronyms = NO
