# Vale prose checks (github.com/errata-ai/vale), run over content/**/*.md by
# .github/workflows/lint.yml. The rules live in styles/Site/:
#   error   Directives  choose, should, recommend, better option, you should
#   error   We          "we" and its contractions: this is one person's research
#   error   Jargon      log point(s), yardstick
#   error   Acronyms    T1-T5 (case-sensitive, so "t1" in a URL-like token is
#                       not caught by accident); SORA came off it on 19 Nov 2026
#                       (see the rule's own comment)
#   warning Causal      lifted, caused, drove, led to: not banned, but each
#                       one is a causal claim the checker should look at
# Vale skips code and link targets by itself. It does read front matter here,
# and that is kept: title and summary are what a reader sees on every card.
# Ignored below: Hugo shortcodes, so their parameter names are never read as
# prose, and URLs and github.com/... repo paths written as text in the body.

StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Site
TokenIgnores = (\{\{[<%].*?[%>]\}\}), (https?://[^\s)"\]]+), (github\.com/[^\s)"\]]+)
# Jacob's own words: "My view" and his answer to "What would you do?" are where he
# says what he would do and why (the Scope line: "In each 'My view' section I say
# where I land and why"), in his words, which the site does not reword. So the
# rules for the analysis voice (Directives, We and the rest) skip those two blocks
# only; the analysis around them is checked in full (19 Nov 2026, SMU week).
BlockIgnores = (?s) *(\{\{< myview >\}\}.*?\{\{< /myview >\}\}), (?s) *(\{\{< answer[^>]*>\}\}.*?\{\{< /answer >\}\})

# A published, sealed bet: its words do not change after the seal, so Jargon
# ("yardstick") is switched off for this one file only. New open pages under
# content/open/ are still checked in full.
[content/open/2026-09-26-coe-or-erp.md]
Site.Jargon = NO

# The same for the PWM open question, sealed 28 September 2026 ("yardstick").
[content/open/2026-09-28-minimum-wage-or-pwm.md]
Site.Jargon = NO

# The researcher companion to the Singapore dollar piece: T1-T4 are the sealed
# test labels, and four of them sit inside a verbatim THESIS quote, so
# Acronyms is switched off for this one file only. Since the publication day
# (14 November 2026) Jargon is too: the page is coe-analysis
# sgd/FOR_RESEARCHERS.md word for word, written for researchers, and
# "yardsticks" in its long-window paragraphs is that note's own word. Every
# other rule still applies to it, and the article itself is checked in full.
[content/researchers/singapore-dollar.md]
Site.Acronyms = NO
Site.Jargon = NO
